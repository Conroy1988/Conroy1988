    <text x="34" y="113" fill="#A9B4BF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Persistent Fire and Rescue management built around real UK operations.</text>
    <path d="M34 146h636" stroke="#9A7CFF" stroke-opacity=".13"/>
    <text x="34" y="178" fill="#D7E2E8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Stations · Appliances · Crews · Routing · Escalation · Maintenance</text>
    <text x="670" y="206" text-anchor="end" fill="#9A7CFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="850">MODEL / COMMAND / PERSIST</text>
