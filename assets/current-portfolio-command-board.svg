<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220" role="img" aria-labelledby="title desc">
  <title id="title">Conroy portfolio architecture</title>
  <desc id="desc">Six core systems spanning public products, publishing, private platforms, game development, live operations and carefully attributed collaboration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071017"/>
      <stop offset="1" stop-color="#0E1019"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58E6D9"/>
      <stop offset=".5" stop-color="#9A7CFF"/>
      <stop offset="1" stop-color="#FF7A70"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E2527"/>
      <stop offset="1" stop-color="#0B161D"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1630"/>
      <stop offset="1" stop-color="#0E121D"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#28200F"/>
      <stop offset="1" stop-color="#11151B"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A1518"/>
      <stop offset="1" stop-color="#11141A"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#F4F1EB" opacity=".03"/>
    </pattern>
  </defs>

  <rect width="1600" height="1220" rx="34" fill="url(#bg)"/>
  <rect width="1600" height="1220" rx="34" fill="url(#dots)"/>
  <rect x="1.5" y="1.5" width="1597" height="1217" rx="32.5" fill="none" stroke="#F4F1EB" stroke-opacity=".1" stroke-width="3"/>

  <text x="72" y="70" fill="#58E6D9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="850" letter-spacing="3.5">PORTFOLIO / 01</text>
  <text x="72" y="124" fill="#F4F1EB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="43" font-weight="850" letter-spacing="-1.3">THE ACTIVE WORK</text>
  <text x="1528" y="78" text-anchor="end" fill="#8E9CAB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Six core systems. One operating discipline.</text>
  <text x="1528" y="105" text-anchor="end" fill="#687784" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Ownership and contribution boundaries are part of the design.</text>
  <rect x="72" y="148" width="1456" height="4" rx="2" fill="url(#line)"/>

  <g transform="translate(72 186)">
