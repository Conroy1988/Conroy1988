    <text x="34" y="42" fill="#B7A8FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="850" letter-spacing="2.6">01 · PUBLIC ECOSYSTEM · CO-OWNED</text>
    <text x="34" y="82" fill="#F4F1EB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="850">TKB DIGITAL ESTATE</text>
    <text x="34" y="113" fill="#A9B4BF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Community website, public publishing and specialist guide applications.</text>
    <g transform="translate(34 140)">
      <rect width="144" height="42" rx="12" fill="#16132A" stroke="#9A7CFF" stroke-opacity=".22"/>
      <text x="72" y="26" text-anchor="middle" fill="#E4DEFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800">TKB GAMING</text>
      <rect x="156" width="150" height="42" rx="12" fill="#16132A" stroke="#9A7CFF" stroke-opacity=".22"/>
      <text x="231" y="26" text-anchor="middle" fill="#E4DEFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800">CRIMSON DESERT</text>
      <rect x="318" width="128" height="42" rx="12" fill="#16132A" stroke="#9A7CFF" stroke-opacity=".22"/>
      <text x="382" y="26" text-anchor="middle" fill="#E4DEFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800">ECO GUIDE</text>
      <rect x="458" width="178" height="42" rx="12" fill="#16132A" stroke="#9A7CFF" stroke-opacity=".22"/>
      <text x="547" y="26" text-anchor="middle" fill="#E4DEFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800">MISSIONCHIEF UK</text>
