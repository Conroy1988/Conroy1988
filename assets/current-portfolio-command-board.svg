      <circle cx="28" cy="28" r="6" fill="#58E6D9"/>
      <text x="48" y="33" fill="#F4F1EB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="820">CONROYMEDIA</text>
      <text x="22" y="61" fill="#9AA7B4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Live infrastructure · Monitoring · Recovery</text>
      <text x="22" y="79" fill="#6F7D8A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">OPERATED ENVIRONMENT</text>
    </g>
    <g transform="translate(386 64)">
      <rect width="332" height="94" rx="18" fill="#151329" stroke="#9A7CFF" stroke-opacity=".2"/>
      <circle cx="28" cy="28" r="6" fill="#9A7CFF"/>
      <text x="48" y="33" fill="#F4F1EB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="820">COMMAND NEXUS</text>
      <text x="22" y="61" fill="#9AA7B4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Marty-owned · Scoped iOS work · Project support</text>
      <text x="22" y="79" fill="#6F7D8A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">ATTRIBUTED COLLABORATION</text>
    </g>
    <g transform="translate(738 64)">
      <rect width="332" height="94" rx="18" fill="#221B10" stroke="#F2B84B" stroke-opacity=".2"/>
      <circle cx="28" cy="28" r="6" fill="#F2B84B"/>
      <text x="48" y="33" fill="#F4F1EB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="820">LSSM V.4</text>
      <text x="22" y="61" fill="#9AA7B4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Two scoped upstream pull requests</text>
      <text x="22" y="79" fill="#6F7D8A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">OPEN-SOURCE CONTRIBUTION</text>
    </g>
    <g transform="translate(1090 64)">
      <rect width="332" height="94" rx="18" fill="#241418" stroke="#FF7A70" stroke-opacity=".2"/>
      <circle cx="28" cy="28" r="6" fill="#FF7A70"/>
      <text x="48" y="33" fill="#F4F1EB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="820">MARTY SYSTEMS</text>
      <text x="22" y="61" fill="#9AA7B4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Control Centre · Crypto bot · Portfolio support</text>
      <text x="22" y="79" fill="#6F7D8A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">CREATOR AUTHORITY PRESERVED</text>
    </g>
  </g>

  <text x="72" y="1184" fill="#687784" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="750" letter-spacing="2">CONROY1988 / ACTIVE PORTFOLIO</text>
  <text x="1528" y="1184" text-anchor="end" fill="#8E9CAB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="750" letter-spacing="2">BUILD · PUBLISH · OPERATE · STEWARD</text>
</svg>
