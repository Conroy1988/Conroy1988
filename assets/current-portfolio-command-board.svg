    <text x="34" y="178" fill="#D7E2E8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Guides · Evidence records · Timelines · Monitoring · Static API</text>
    <circle cx="638" cy="170" r="12" fill="#F2B84B" opacity=".14"/>
    <circle cx="638" cy="170" r="5" fill="#F2B84B"/>
