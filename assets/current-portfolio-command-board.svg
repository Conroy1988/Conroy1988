    <path d="M34 146h636" stroke="#58E6D9" stroke-opacity=".13"/>
    <text x="34" y="178" fill="#D7E2E8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Markets · Ledger · Evidence · Security · Backups · Human approval</text>
    <text x="670" y="206" text-anchor="end" fill="#58E6D9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="850">ANALYSE / CONSTRAIN / DECIDE</text>
  </g>

  <g transform="translate(824 690)">
    <rect width="704" height="226" rx="26" fill="url(#violet)" stroke="#9A7CFF" stroke-opacity=".25"/>
    <text x="34" y="42" fill="#B7A8FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="850" letter-spacing="2.6">06 · PRIVATE GAME · CREATOR</text>
