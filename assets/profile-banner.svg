<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Daniel Conroy — systems, worlds and operations</title>
  <desc id="desc">An editorial portfolio banner connecting product design, community systems, intelligence, automation, games and live infrastructure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050B10"/>
      <stop offset="0.56" stop-color="#09131C"/>
      <stop offset="1" stop-color="#100D19"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58E6D9"/>
      <stop offset="0.52" stop-color="#9A7CFF"/>
      <stop offset="1" stop-color="#FF7A70"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2B84B"/>
      <stop offset="1" stop-color="#FF7A70"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#9A7CFF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#9A7CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#F4F1EB" opacity=".035"/>
    </pattern>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
  </defs>

  <rect width="1600" height="720" rx="38" fill="url(#bg)"/>
  <rect width="1600" height="720" rx="38" fill="url(#grain)"/>
  <rect x="1.5" y="1.5" width="1597" height="717" rx="36.5" fill="none" stroke="#F4F1EB" stroke-opacity=".12" stroke-width="3"/>
  <path d="M0 586C318 548 520 620 820 589c322-33 452-174 780-144v275H0Z" fill="#9A7CFF" opacity=".026"/>
  <circle cx="1370" cy="92" r="290" fill="url(#halo)"/>
  <circle cx="1020" cy="690" r="160" fill="#58E6D9" opacity=".07" filter="url(#blur)"/>

  <g transform="translate(72 65)">
    <rect width="88" height="88" rx="28" fill="#0E1B25" stroke="#F4F1EB" stroke-opacity=".16"/>
    <path d="M61 27c-5-6-11-9-19-9-15 0-26 11-26 26s11 26 26 26c8 0 15-3 20-9l-9-9c-3 3-6 5-11 5-8 0-13-6-13-13s5-13 13-13c4 0 8 2 11 5z" fill="url(#signal)"/>
    <circle cx="67" cy="21" r="5" fill="#F2B84B"/>
  </g>
  <text x="184" y="93" fill="#F4F1EB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing="4">DANIEL CONROY</text>
  <text x="184" y="126" fill="#8E9CAB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" letter-spacing="2.2">EDINBURGH · SCOTLAND</text>

  <text x="72" y="260" fill="#F4F1EB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="103" font-weight="850" letter-spacing="-5">SYSTEMS,</text>
  <text x="72" y="356" fill="url(#signal)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="103" font-weight="850" letter-spacing="-5">WORLDS &amp;</text>
  <text x="72" y="452" fill="#F4F1EB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="103" font-weight="850" letter-spacing="-5">OPERATIONS.</text>

  <rect x="76" y="497" width="640" height="4" rx="2" fill="url(#signal)"/>
  <text x="74" y="546" fill="#C7D0D9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600">I make complex systems understandable, controllable</text>
  <text x="74" y="578" fill="#C7D0D9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600">and recoverable.</text>

  <g transform="translate(972 102)">
    <circle cx="252" cy="250" r="210" fill="none" stroke="#F4F1EB" stroke-opacity=".07"/>
    <circle cx="252" cy="250" r="148" fill="none" stroke="#F4F1EB" stroke-opacity=".09" stroke-dasharray="4 12"/>
    <circle cx="252" cy="250" r="82" fill="#0E1822" stroke="url(#signal)" stroke-width="2"/>
    <circle cx="252" cy="250" r="64" fill="#09131C" stroke="#F4F1EB" stroke-opacity=".11"/>
    <text x="252" y="244" text-anchor="middle" fill="#F4F1EB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="850" letter-spacing="2">CONROY</text>
    <text x="252" y="270" text-anchor="middle" fill="#8E9CAB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2.6">OPERATING CORE</text>

    <path d="M252 168 176 102M334 250l88-2M252 332l-68 75M170 250 76 224" fill="none" stroke="#F4F1EB" stroke-opacity=".14"/>
    <path d="M176 102 76 224M422 248l21 118M184 407l259-41" fill="none" stroke="#F4F1EB" stroke-opacity=".055"/>

    <g transform="translate(128 54)">
      <circle cx="48" cy="48" r="47" fill="#0A1C20" stroke="#58E6D9" stroke-opacity=".55"/>
      <circle cx="48" cy="48" r="6" fill="#58E6D9"/>
      <text x="48" y="78" text-anchor="middle" fill="#D9FFFA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="1.5">BUILD</text>
    </g>
    <g transform="translate(374 200)">
      <circle cx="48" cy="48" r="47" fill="#151126" stroke="#9A7CFF" stroke-opacity=".58"/>
      <circle cx="48" cy="48" r="6" fill="#9A7CFF"/>
      <text x="48" y="78" text-anchor="middle" fill="#E4DEFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="1.5">PUBLISH</text>
    </g>
    <g transform="translate(136 359)">
      <circle cx="48" cy="48" r="47" fill="#241A0C" stroke="#F2B84B" stroke-opacity=".58"/>
      <circle cx="48" cy="48" r="6" fill="#F2B84B"/>
      <text x="48" y="78" text-anchor="middle" fill="#FFF0C9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="1.5">OPERATE</text>
    </g>
    <g transform="translate(28 176)">
      <circle cx="48" cy="48" r="47" fill="#241212" stroke="#FF7A70" stroke-opacity=".56"/>
      <circle cx="48" cy="48" r="6" fill="#FF7A70"/>
      <text x="48" y="78" text-anchor="middle" fill="#FFE0DD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="1.5">STEWARD</text>
    </g>
    <g transform="translate(395 318)">
      <circle cx="48" cy="48" r="36" fill="#111B1D" stroke="#58E6D9" stroke-opacity=".25"/>
      <text x="48" y="52" text-anchor="middle" fill="#8E9CAB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="800">LIVE</text>
    </g>
  </g>

  <g transform="translate(72 645)">
    <text x="0" y="0" fill="#58E6D9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="850" letter-spacing="2.3">PRODUCTS</text>
    <circle cx="116" cy="-4" r="3" fill="#53616E"/>
    <text x="140" y="0" fill="#9A7CFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="850" letter-spacing="2.3">COMMUNITIES</text>
    <circle cx="298" cy="-4" r="3" fill="#53616E"/>
    <text x="322" y="0" fill="#F2B84B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="850" letter-spacing="2.3">INTELLIGENCE</text>
    <circle cx="472" cy="-4" r="3" fill="#53616E"/>
    <text x="496" y="0" fill="#FF7A70" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="850" letter-spacing="2.3">INFRASTRUCTURE</text>
  </g>
  <text x="1526" y="650" text-anchor="end" fill="#6F7D8A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="750" letter-spacing="2">CONROY1988 · GITHUB</text>
</svg>
